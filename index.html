.section-sub {
  font-size: clamp(15px,1.6vw,17px);
  color: var(--muted);
  line-height: 1.70;
}
.sec-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--p);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
}

/* \u2500\u2500 NAVBAR \u2500\u2500 */
nav {
  position: sticky;
  top: 0;
  z-index: 500;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,180,122,.15);
  height: var(--nav-h);
}
.nav-logo-text {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.8px;
  color: var(--dark);
}
.nav-links { display:flex; align-items:center; gap:4px; }
.nav-link {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 7px 14px;
  border-radius: 8px;
  transition: color .18s, background .18s;
}
.nav-link:hover, .nav-link.active { color: var(--dark); background: var(--p-lt); }
.nav-link { color: #1a3a2a !important; }
.nav-cta {
  font-size: 13px; font-weight: 700;
  background: var(--dark); color: #fff;
  border: none; cursor: pointer;
  padding: 10px 20px; border-radius: 50px;
  transition: background .18s, transform .18s;
}
.nav-cta:hover { background: var(--p-dk); transform: translateY(-1px); }

/* \u2500\u2500 HERO SECTION \u2500\u2500 */
.home-hero-section {
  background: linear-gradient(145deg,#001F12 0%,#002D1C 35%,#003D26 65%,#004D30 100%);
  padding: clamp(80px,11vw,140px) clamp(20px,5vw,40px) clamp(60px,8vw,100px);
  position: relative; overflow: hidden;
}
/* Force white text inside dark hero */
.home-hero-section .sec-label{color:rgba(0,255,160,.8) !important}
.home-hero-section .hero-sub{color:rgba(255,255,255,.75) !important}
.home-hero-section .stat-badge .n{color:#fff !important}
.home-hero-section .stat-badge .l{color:rgba(255,255,255,.6) !important}
.home-hero-section .stat-badge{border-color:rgba(255,255,255,.15) !important;background:rgba(255,255,255,.06) !important}
.home-hero-section .home-hero-btns .ap-btn-secondary{color:#fff !important;border-color:rgba(255,255,255,.3) !important;background:rgba(255,255,255,.1) !important}
.home-hero-section .home-hero-btns .ap-btn-secondary:hover{background:rgba(255,255,255,.18) !important}
/* Hero mockup card \u2014 keep white so it contrasts */
.home-hero-section .ui-float-card{background:#fff !important}
.home-hero-section::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 80% at 110% 50%, rgba(0,180,122,.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at -20% 80%, rgba(0,60,46,.04) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(40px,6vw,80px);
  align-items: center;
  max-width: 1200px; margin: 0 auto; position: relative;
}
@media(max-width:840px) { .home-hero-grid{grid-template-columns:1fr 1fr;gap:16px} .home-hero-right{display:block} }
@media(max-width:640px) { 
  .home-hero-right{display:block !important;transform:scale(.75);transform-origin:top right}
  .ui-float-card{padding:12px !important}
}
@media(max-width:480px) {
  /* On very small phones: stack vertically, hide mockup */
  .home-hero-grid{grid-template-columns:1fr !important}
  .home-hero-right{display:none !important}
}
.home-hero-stats { display:flex; gap:clamp(10px,2vw,32px); margin-top:32px; flex-wrap:wrap; overflow:visible; }
.stat-badge { display:flex; flex-direction:column; gap:2px; }
.stat-badge .n { font-size:clamp(18px,3.5vw,24px); font-weight:800; font-family:'DM Mono',monospace; color:var(--dark); letter-spacing:-1px; }
.stat-badge .l { font-size:11px; color:var(--muted); font-weight:500; }

/* \u2500\u2500 UI FLOAT CARD \u2500\u2500 */
.ui-float-card {
  background: #fff; border:1.5px solid var(--border); border-radius:20px;
  padding: 24px; box-shadow: var(--sh-lg); animation: floatUp 4s ease-in-out infinite;
}
.ui-float-card .val { font-size:34px; font-weight:800; font-family:'DM Mono',monospace; letter-spacing:-2px; color:var(--dark); }

/* \u2500\u2500 TRUST BAR \u2500\u2500 */
.trust-bar-wrap { background:#fff; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:18px 0; }
.home-trust-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px 16px; max-width:1200px; margin:0 auto; padding:0 clamp(16px,5vw,40px); }
.trust-bar-item { display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; font-weight:600; color:var(--muted); }

/* \u2500\u2500 MODULE CARDS \u2500\u2500 */
.home-cards-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
.module-card {
  background: #fff; border:1.5px solid var(--border); border-radius:var(--r-lg);
  padding: 28px 24px; cursor:pointer; display:flex; flex-direction:column;
  transition: border-color .22s, box-shadow .22s, transform .22s;
}
.module-card:hover { border-color:var(--p); box-shadow:0 8px 32px rgba(0,180,122,.15); transform:translateY(-4px); }
.module-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:16px; }
.module-cta { margin-top:20px; font-size:13px; font-weight:700; color:var(--p); display:flex; align-items:center; gap:4px; transition:gap .18s; }
.module-card:hover .module-cta { gap:8px; }

/* \u2500\u2500 BENEFITS SLIDER \u2500\u2500 */
.benefits-track-wrap { overflow:hidden; padding:8px 0; }
.benefits-track { display:flex; gap:20px; width:max-content; animation:scrollX 38s linear infinite; }
.benefits-track:hover { animation-play-state:paused }
.benefit-card { background:#fff; border:1.5px solid var(--border); border-radius:var(--r-lg); padding:28px 24px; width:280px; flex-shrink:0; }
.home-steps-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media(max-width:768px) { .home-steps-grid{grid-template-columns:1fr} }

/* \u2500\u2500 BUTTONS \u2500\u2500 */
.ap-btn-cta {
  display: inline-flex; align-items:center; gap:8px;
  background: linear-gradient(135deg, var(--p), var(--p-dk));
  color: #fff; font-size:15px; font-weight:700;
  border: none; cursor:pointer;
  padding: 16px 32px; border-radius: var(--pill);
  transition: all .2s; box-shadow: var(--sh-p);
  letter-spacing: -.2px;
}
.ap-btn-cta:hover { background:linear-gradient(135deg,#00C88A,var(--p)); transform:translateY(-2px); box-shadow:0 14px 36px rgba(0,180,122,.35); }
.ap-btn { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; border:1.5px solid var(--border); cursor:pointer; padding:11px 22px; border-radius:var(--pill); transition:all .18s; background:#fff; color:var(--text); }
.ap-btn:hover { border-color:var(--p); color:var(--p); background:var(--p-lt); }
.ap-btn-primary   { background:linear-gradient(135deg,var(--p),var(--p-dk)); color:#fff; border-color:transparent; box-shadow:var(--sh-p); }
.ap-btn-primary:hover { transform:translateY(-1px); box-shadow:0 10px 28px rgba(0,180,122,.35); }
.ap-btn-secondary { background:#fff; border-color:var(--border); }
.ap-btn-secondary:hover { border-color:var(--p); color:var(--p); }
.ap-btn-ghost     { background:transparent; border-color:transparent; color:var(--muted); }
.ap-btn-ghost:hover { color:var(--dark); background:var(--p-lt); }
.ap-btn-success {
  background: linear-gradient(135deg, #00C88A, #00A86B);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 24px rgba(0,168,107,.35), 0 2px 8px rgba(0,0,0,.08);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .01em;
  animation: pulse-cta 2.2s ease-in-out infinite;
}
.ap-btn-success:hover:not(:disabled) {
  background: linear-gradient(135deg, #00D494, #00B47A);
  box-shadow: 0 10px 32px rgba(0,168,107,.45);
  transform: translateY(-2px);
}
.ap-btn-success:active { transform: translateY(0); }
.ap-btn-success:disabled {
  background: #C8D9D0;
  color: #8FA89E;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
  animation: none;
}
.ap-btn-sm { padding:7px 14px; font-size:12px; }

/* \u2500\u2500 CARDS / SURFACES \u2500\u2500 */
.ap-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
  padding: 28px 32px;
  margin-bottom: 16px;
}
@media(max-width:600px) { .ap-card { padding: 20px 18px; } }

/* \u2500\u2500 FORM ELEMENTS \u2014 MODERN PREMIUM STYLE \u2500\u2500 */
.ap-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--mid);
  display: block;
  margin-bottom: 7px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.ap-input {
  width: 100%;
  height: var(--inp-h);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 0 16px;
  font-size: 15px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 500;
  color: var(--text);
  background: var(--surf);
  transition: border-color .15s, box-shadow .15s, background .15s;
  outline: none;
}
.ap-input:focus {
  border-color: var(--p);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(0,180,122,.10);
}
.ap-input::placeholder { color: #B5C5BF; font-weight: 400; }
.ap-input.err { border-color:#EF4444; box-shadow:0 0 0 4px rgba(239,68,68,.08); }
textarea.ap-input { height: auto; padding: 14px 16px; }
select.ap-input {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='7' viewBox='0 0 12 7' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2300B47A' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  cursor: pointer;
}
select.ap-input:disabled { opacity:.45; cursor:not-allowed; }

/* Form group with floating-label feel */
.ap-field { display:flex; flex-direction:column; gap:0; }

/* \u2500\u2500 FORM SECTIONS (card headers) \u2500\u2500 */
.form-section-header {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 20px; margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.form-section-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--p-lt), var(--p-xlt));
  border: 1.5px solid rgba(0,180,122,.2);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.form-section-title { font-size: 16px; font-weight: 700; color: var(--dark); }
.form-section-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* \u2500\u2500 CHECKBOX / LEGAL CHECKS \u2500\u2500 */
.ap-check {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 18px;
  background: var(--surf); border-radius: 12px;
  border: 1.5px solid var(--border); cursor: pointer;
  transition: border-color .15s, background .15s;
}
.ap-check:hover { border-color: var(--p); background: var(--p-xlt); }
.ap-check input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: var(--p);
  cursor: pointer; flex-shrink: 0; margin-top: 1px;
}

/* \u2500\u2500 LAYOUT HELPERS \u2500\u2500 */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:600px){ .grid-2{grid-template-columns:1fr} }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
@media(max-width:600px){ .grid-3{grid-template-columns:1fr} }
.module-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:600px){ .module-form-grid{grid-template-columns:1fr} }

/* \u2500\u2500 TOGGLE \u2500\u2500 */
.toggle { width:44px; height:24px; border-radius:12px; background:#DDE5E0; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0 }
.toggle.on { background:var(--p) }
.toggle-thumb { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--sh-xs); transition:transform .18s cubic-bezier(.34,1.56,.64,1) }
.toggle.on .toggle-thumb { transform:translateX(20px) }

/* \u2500\u2500 PHONE INPUT \u2500\u2500 */
.phone-wrap { display:flex; }
.phone-prefix {
  display:flex; align-items:center; justify-content:center;
  padding: 0 14px; background: var(--p-lt); border: 2px solid var(--border);
  border-right: none; border-radius: 12px 0 0 12px;
  font-size:14px; font-weight:700; color:var(--p); white-space:nowrap; flex-shrink:0;
  height: var(--inp-h);
}
.phone-input { border-radius: 0 12px 12px 0 !important; }

/* \u2500\u2500 FOOTER \u2500\u2500 */
.footer-grid { display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:40px; }
@media(max-width:768px) { .footer-grid { grid-template-columns:1fr 1fr } }
@media(max-width:480px) { .footer-grid { grid-template-columns:1fr } }

/* \u2500\u2500 MOBILE DRAWER \u2500\u2500 */
.ap-burger { display:none; background:none; border:none; cursor:pointer; padding:8px; color:var(--dark); font-size:20px; }
.ap-drawer { position:fixed; inset:0; z-index:300 }
.ap-drawer-bg { position:absolute; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(4px) }
.ap-drawer-panel { position:absolute; top:0; right:0; bottom:0; width:min(280px,85vw); background:#fff; box-shadow:var(--sh-lg); padding:24px 0; overflow-y:auto; animation:scaleIn .25s ease }
@media(max-width:768px) { .ap-burger{display:flex} .nav-links{display:none} }

/* \u2500\u2500 ADMIN SHELL LAYOUT \u2500\u2500 */
.desktop-only{display:block}
@media(max-width:768px){.desktop-only{display:none !important}}
.admin-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; cursor:pointer;
  color:#6B8F7A; font-size:13px; font-weight:600;
  transition:all .15s; margin:1px 0;
  font-family:inherit; border:none; background:none;
  width:100%; text-align:left; letter-spacing:.01em;
}
.admin-item:hover { background:rgba(255,255,255,.07); color:#C8DDD6; }
.admin-item.active {
  background:linear-gradient(90deg,rgba(0,200,138,.18),rgba(0,200,138,.04));
  color:#00C88A; border-left:3px solid #00C88A; padding-left:9px;
  font-weight:700;
}

/* \u2500\u2500 ADMIN STAT CARDS \u2500\u2500 */
.admin-stat-card {
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 100%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px; padding:20px 22px;
  transition:border-color .2s;
}
.admin-stat-card:hover { border-color:rgba(0,200,138,.3); }
.admin-stat-num {
  font-size:36px; font-weight:800; letter-spacing:-1.5px;
  font-family:'DM Mono',monospace; line-height:1;
}
.admin-stat-label { font-size:11px; color:#6B8F7A; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }
.admin-stat-sub { font-size:11px; color:#4A6B5E; margin-top:6px; }

/* \u2500\u2500 ADMIN SECTION HEADERS \u2500\u2500 */
.admin-section-title { font-size:20px; font-weight:800; color:#E8F5EE; margin-bottom:4px; letter-spacing:-.3px; }
.admin-section-sub { font-size:12px; color:#5A8070; }

/* \u2500\u2500 ADMIN TABLES \u2500\u2500 */
.admin-table-row {
  display:grid; align-items:center; padding:13px 16px;
  border-radius:10px; font-size:13px; color:#C8DDD6;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .13s;
}
.admin-table-row:hover { background:rgba(255,255,255,.04); color:#E8F5EE; }
.admin-badge {
  display:inline-flex; align-items:center; padding:3px 9px;
  border-radius:20px; font-size:11px; font-weight:700;
}

/* \u2500\u2500 ADMIN KPI CARDS \u2500\u2500 */
.kpi-card {
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 100%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px; padding:20px 22px;
  transition:border-color .2s, transform .2s;
  display:flex; flex-direction:column; gap:4px;
}
.kpi-card:hover { transform:translateY(-2px); }
.kpi-label { font-size:11px; font-weight:700; color:#5A8070; letter-spacing:.07em; text-transform:uppercase; }
.kpi-val { font-size:30px; font-weight:800; letter-spacing:-1px; font-family:'DM Mono',monospace; line-height:1; margin:4px 0; }
.kpi-sub { font-size:11px; color:#4A6B5E; }

/* \u2500\u2500 LEADS PANEL \u2500\u2500 */
.leads-row {display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:13px}
.leads-row:hover{background:var(--surf)}

/* \u2500\u2500 SHOWROOM \u2500\u2500 */
.showroom-card {
  transition:transform .2s,box-shadow .22s;
}
.showroom-card:hover {
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,100,60,.14);
}
.inventory-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.inv-card {background:#fff;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.inv-card:hover{box-shadow:var(--sh-md);transform:translateY(-3px)}
.inv-card-img {background:var(--surf);height:180px;display:flex;align-items:center;justify-content:center;font-size:48px}
.inv-card-body{padding:16px}
.inv-card-price{font-size:20px;font-weight:800;color:var(--dark);letter-spacing:-0.8px;font-family:'DM Mono',monospace}

/* \u2500\u2500 MODALS \u2500\u2500 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:var(--r-lg);padding:32px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:scaleIn .25s ease}

/* \u2500\u2500 STEP INDICATOR \u2500\u2500 */
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s}
.step-dot.active{background:var(--p)}

/* \u2500\u2500 CREDITO TERMS \u2500\u2500 */
.credito-terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* \u2500\u2500 RANGE SLIDER \u2500\u2500 */
.ap-slider { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; outline:none; cursor:pointer; }
.ap-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--p); cursor:pointer; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,180,122,.4); }
.ap-slider::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--p); cursor:pointer; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,180,122,.4); }

/* \u2500\u2500 RESPONSIVE FIXES \u2500\u2500 */
@media(min-width:769px){.ap-burger{display:none !important}}

/* Sticky CTA mobile */
@media(max-width:768px){
  .sticky-cta-mobile{ display:flex !important; }
}

/* Mobile \u2264600px */
@media(max-width:600px){
  .module-form-grid{grid-template-columns:1fr !important}
  .credito-terms-grid{grid-template-columns:1fr !important}
  .grid-3{grid-template-columns:1fr 1fr !important}
  .ap-card{padding:18px 14px !important;border-radius:14px !important}
  .grid-2{grid-template-columns:1fr !important}
  /* VehicleForm year combo stacks on tiny screens */
  .vf-year-row{flex-direction:column}
  /* Module pages: reduce top padding */
  .module-page-wrap{padding:20px 14px !important}
  /* Result cards: full width numbers */
  .result-money{font-size:36px !important}
  /* Price slider reference grid */
  .grid-3.price-ref{grid-template-columns:1fr !important}
  /* Credito amort chart */
  .amort-chart-wrap{overflow-x:auto}
  /* Admin config tabs: scroll horizontally */
  .admin-tabs{overflow-x:auto;flex-wrap:nowrap !important;padding-bottom:4px}
  .admin-tab-btn{white-space:nowrap;flex-shrink:0}
  /* Home hero: reduce font sizes */
  .hero-headline{font-size:clamp(28px,8vw,42px) !important}
  .hero-sub{font-size:15px !important}
}

/* Tablet 601-768px */  
@media(min-width:601px) and (max-width:768px){
  .grid-3{grid-template-columns:1fr 1fr !important}
  .ap-card{padding:22px 20px !important}
  .home-hero-grid{grid-template-columns:1fr 1fr;gap:16px}
  .hero-headline{font-size:clamp(32px,6vw,48px) !important;color:#fff !important;-webkit-text-fill-color:#fff !important}
}

/* Tiny screens \u2264380px */
@media(max-width:380px){
  .grid-3{grid-template-columns:1fr !important}
  .stat-badge{flex-direction:column;text-align:center;min-width:70px}

/* \u2500\u2500\u2500 MOBILE OVERFLOW FIX \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
html,body{max-width:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch}
*{box-sizing:border-box}
img,svg,video{max-width:100%;height:auto}

/* \u2500\u2500\u2500 HERO BLOBS (were missing) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hero-blob-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;max-width:100%}
.hero-blob{position:absolute;border-radius:50%;filter:blur(72px);mix-blend-mode:screen}
@keyframes blobDrift1{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.1)}
  66%{transform:translate(-20px,40px) scale(0.92)}
}
@keyframes blobDrift2{
  0%,100%{transform:translate(0,0) scale(1)}
  40%{transform:translate(-50px,20px) scale(1.08)}
  80%{transform:translate(30px,-40px) scale(0.95)}
}
@keyframes blobDrift3{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(20px,30px) scale(1.05)}
}
.hb1{width:640px;height:640px;top:-120px;left:-80px;
     background:radial-gradient(circle,rgba(0,220,150,.5) 0%,rgba(0,180,120,.2) 50%,transparent 70%);
     animation:blobDrift1 9s ease-in-out infinite}
.hb2{width:500px;height:500px;top:50px;right:-100px;
     background:radial-gradient(circle,rgba(0,255,180,.35) 0%,rgba(0,200,140,.15) 50%,transparent 70%);
     animation:blobDrift2 12s ease-in-out infinite}
.hb3{width:380px;height:380px;bottom:-60px;left:30%;
     background:radial-gradient(circle,rgba(50,255,180,.25) 0%,transparent 65%);
     animation:blobDrift3 7s ease-in-out infinite}
.grid-pattern{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,255,160,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,160,.06) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black,transparent)
}

/* \u2500\u2500\u2500 ANIMATED BLOB HERO BACKGROUND \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Usage: add className="blob-hero" to section headers             */
@keyframes blobFloat{
  0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;transform:translate(0,0) scale(1)}
  25%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;transform:translate(8px,-12px) scale(1.02)}
  50%{border-radius:50% 60% 30% 40%/40% 50% 60% 50%;transform:translate(-6px,8px) scale(0.98)}
  75%{border-radius:40% 30% 60% 50%/60% 40% 50% 40%;transform:translate(10px,4px) scale(1.01)}
}
@keyframes blobFloat2{
  0%,100%{border-radius:40% 60% 70% 30%/40% 50% 60% 50%;transform:translate(0,0) scale(1)}
  33%{border-radius:70% 30% 50% 60%/30% 70% 40% 60%;transform:translate(-10px,6px) scale(1.03)}
  66%{border-radius:30% 50% 40% 70%/60% 30% 70% 40%;transform:translate(6px,-8px) scale(0.97)}
}
@keyframes shimmer{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}
@keyframes wave{
  0%,100%{transform:translateX(0) scaleY(1)}
  50%{transform:translateX(-25%) scaleY(.8)}
}
@keyframes pulse-soft{
  0%,100%{opacity:.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.04)}
}
.blob-hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#003D26 0%,#005C35 40%,#00845A 70%,#00B47A 100%);
}
.blob-hero::before,.blob-hero::after{
  content:"";position:absolute;border-radius:60% 40% 30% 70%/60% 30% 70% 40%;
  mix-blend-mode:screen;pointer-events:none;
}
.blob-hero::before{
  width:500px;height:500px;top:-120px;left:-100px;
  background:radial-gradient(circle,rgba(0,200,138,.35) 0%,transparent 70%);
  animation:blobFloat 8s ease-in-out infinite;
}
.blob-hero::after{
  width:400px;height:400px;bottom:-80px;right:-60px;
  background:radial-gradient(circle,rgba(0,255,180,.2) 0%,transparent 70%);
  animation:blobFloat2 10s ease-in-out infinite;
}

/* \u2500\u2500\u2500 MODULE SECTION HEADERS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

/* \u2500\u2500\u2500 FORM FOCUS RING UPGRADE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

/* \u2500\u2500\u2500 HERO IMAGE ROW \u2014 keep 2 cols on mobile \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
