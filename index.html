function LoanView({cfg}){

        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{background:D.surface,border:`1px solid ${D.border}`,borderRadius:6,padding:'6px 10px',display:'flex',alignItems:'center',gap:5}}><Ico d={P.search} size={12} color={D.dim}/><input value={q} onChange={e=>sQ(e.target.value)} placeholder="Buscar..." style={{background:'none',border:'none',outline:'none',color:D.text,fontSize:11,width:160,fontFamily:"'Inter'"}}/></div>
          <button onClick={()=>csv(LOANS,'prestamos')} style={{background:'none',border:`1px solid ${D.border}`,borderRadius:6,padding:'6px 12px',color:D.dim,fontSize:11,cursor:'pointer',fontFamily:"'Inter'"}}><Ico d={P.down} size={11} color={D.dim}/></button>
        </div>
      </div>
      {f!=='todos'&&<div style={{background:`${D.amber}08`,border:`1px solid ${D.amber}20`,borderRadius:6,padding:'6px 12px',marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}><span style={{color:D.amber,fontSize:11}}>Filtro: <strong>{SN[f]}</strong> ({fl.length})</span><button onClick={()=>sF('todos')} style={{background:'none',border:'none',color:D.dim,cursor:'pointer',fontSize:10,fontFamily:"'Inter'"}}>Limpiar</button></div>}
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:1050}}>
        <thead><tr>{['ID','Cliente','Vehículo','Monto','TEA','Avance','Cuota','Estado','SBS','LTV','Vence',''].map(h=><Th key={h}>{h}</Th>)}</tr></thead>
        <tbody>{fl.map(l=>{const pr=Math.round((l.paid/l.term)*100);const ltv=Math.round((l.amt/l.val)*100);const rc={mora:D.red,riesgo:D.amber,nuevo:D.accent,al_dia:D.green}[l.st]||D.green;
          return <Tr key={l.id} onClick={()=>sSel(l)}>
            <Td mono c={D.gold}>{l.id}</Td><Td>{l.cl}</Td><td style={{padding:'9px 10px',color:D.dim,fontSize:11,whiteSpace:'nowrap'}}>{l.veh} · {l.pl}</td>
            <Td mono>{$(l.amt)}</Td><td style={{padding:'9px 10px',color:l.tea>35?D.red:l.tea>28?D.amber:D.green,fontFamily:"'JetBrains Mono'",fontSize:12,fontWeight:600}}>{l.tea}%</td>

            <Td mono>{$(l.fee)}</Td><td style={{padding:'9px 10px'}}><Badge s={l.st}/></td><td style={{padding:'9px 10px'}}><Sbs v={l.sbs}/></td>
            <td style={{padding:'9px 10px'}}><span style={{color:ltv>80?D.red:ltv>70?D.amber:D.green,fontFamily:"'JetBrains Mono'",fontSize:11,fontWeight:600}}>{ltv}%</span></td>
            <td style={{padding:'9px 10px',color:l.st==='mora'?D.red:D.dim,fontSize:11}}>{l.due}</td>
            <td style={{padding:'9px 10px'}}><div style={{display:'flex',gap:4}}>

              <a href={wa(l.ph,`Hola ${l.cl.split(' ')[0]}, le recordamos su cuota AutoPago de ${$(l.fee)} (vence ${l.due}). Gracias.`)} target="_blank" onClick={e=>e.stopPropagation()} style={{background:`${D.green}15`,border:`1px solid ${D.green}30`,borderRadius:5,padding:'3px 8px',color:D.green,fontSize:10}}>WA</a>
            </div></td>
          </Tr>;
        })}</tbody>
      </table></div>
    </div>
    {/* MODAL */}
    {sel&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={()=>sSel(null)}>
      <div style={{background:D.surface,border:`1px solid ${D.borderHi}`,borderRadius:14,padding:28,maxWidth:600,width:'100%',maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>

          <button onClick={()=>sSel(null)} style={{background:'none',border:'none',color:D.dim,cursor:'pointer'}}><Ico d={P.x} size={20} color={D.dim}/></button>

          {sel.st==='mora'?'Préstamo en mora — Clasificación SBS: '+sel.sbs:'Préstamo en riesgo — SBS: '+sel.sbs}

        <div className="g3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}>
          {[{l:'Valor garantía',v:$(sel.val)},{l:'Monto',v:$(sel.amt)},{l:'LTV',v:Math.round(sel.amt/sel.val*100)+'%'},{l:'TEA',v:sel.tea+'%'},{l:'Cuota',v:$(sel.fee)},{l:'Plazo',v:sel.term+'m'},{l:'Pagadas',v:`${sel.paid}/${sel.term}`},{l:'Saldo',v:$(sel.fee*(sel.term-sel.paid))},{l:'Intereses',v:$(Math.round(sel.fee*sel.term-sel.amt))},{l:'Inicio',v:sel.dt},{l:'Próx. cuota',v:sel.due},{l:'SBS',v:sel.sbs}].map(({l,v})=><div key={l} style={{background:D.card,borderRadius:6,padding:'8px 10px'}}><div style={{color:D.dim,fontSize:8,textTransform:'uppercase',letterSpacing:.8,marginBottom:4,fontFamily:"'Inter'"}}>{l}</div><div style={{color:D.text,fontSize:12,fontWeight:600,fontFamily:v.includes('S/')||v.includes('%')?"'JetBrains Mono'":"'Inter'"}}>{v}</div></div>)}
        </div>
        <div style={{background:D.card,borderRadius:8,padding:'12px 14px',marginBottom:14}}>
          <div style={{color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:.8,marginBottom:8,fontFamily:"'Inter'"}}>Amortización</div>
          <div style={{background:D.border,borderRadius:4,height:8,overflow:'hidden',marginBottom:6}}><div style={{width:`${Math.round(sel.paid/sel.term*100)}%`,height:'100%',background:{mora:D.red,riesgo:D.amber,nuevo:D.accent,al_dia:D.green}[sel.st]||D.green,borderRadius:4}}/></div>

// ═══════════════════════════════════════════════════════════
// TASADOR INTERNO (herramienta admin para evaluar autos)
// ═══════════════════════════════════════════════════════════
function TasadorView({cfg}){
  const [b,sB]=useState('');const [m,sM]=useState('');const [y,sY]=useState(2021);const [k,sK]=useState(40000);
  const bd=MODEL_DB[b];const md=bd?.models?.[m];const or=bd?.origin||'';const pen=cfg.penalties[or]||0;
  const calc=()=>{if(!md)return 0;const age=2026-y;const dY=Math.max(0,1-age*.07);const dK=Math.max(0,1-(k/200000)*.3);return Math.round((md.min+md.max)/2*dY*dK)};
  const mktVal=calc();const offerVal=Math.round(mktVal*(1-pen/100));const spread=mktVal-offerVal;
  return <div>
    <div style={{background:D.card,border:`1px solid ${D.border}`,borderRadius:10,padding:20,marginBottom:16}}>
      <div style={{color:D.text,fontWeight:600,fontSize:14,fontFamily:"'Space Grotesk'",marginBottom:4}}>Tasador de vehículos</div>
      <div style={{color:D.dim,fontSize:11,marginBottom:16,fontFamily:"'Inter'"}}>Evalúa vehículos de clientes que contactan por WhatsApp. Valor de mercado, oferta sugerida con castigo, y margen de ganancia. El cliente nunca ve estos datos.</div>
      <div className="g2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
        <div><label style={{display:'block',color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>Marca</label><select value={b} onChange={e=>{sB(e.target.value);sM('')}} style={{width:'100%',background:D.surface,border:`1px solid ${D.border}`,borderRadius:6,padding:'8px 10px',color:D.text,fontSize:12,fontFamily:"'Inter'",outline:'none',appearance:'auto'}}><option value="">Seleccionar marca</option>{BRANDS.map(x=><option key={x} value={x}>{x}</option>)}</select></div>
        <div><label style={{display:'block',color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>Modelo</label><select value={m} onChange={e=>sM(e.target.value)} disabled={!b} style={{width:'100%',background:D.surface,border:`1px solid ${D.border}`,borderRadius:6,padding:'8px 10px',color:b?D.text:D.dim,fontSize:12,fontFamily:"'Inter'",outline:'none',appearance:'auto'}}><option value="">{b?'Seleccionar modelo':'Elige marca primero'}</option>{bd?Object.keys(bd.models).sort().map(x=><option key={x} value={x}>{x}</option>):null}</select></div>
      </div>
      <div className="g2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
        <div><label style={{display:'block',color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>Año</label><div style={{display:'flex',alignItems:'center',gap:6}}><input type="range" min={2010} max={2026} value={y} onChange={e=>sY(+e.target.value)} style={{flex:1,accentColor:D.accent}}/><span style={{fontFamily:"'JetBrains Mono'",fontSize:12,color:D.text,minWidth:36}}>{y}</span></div></div>
        <div><label style={{display:'block',color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>Kilometraje</label><div style={{display:'flex',alignItems:'center',gap:6}}><input type="range" min={0} max={200000} step={5000} value={k} onChange={e=>sK(+e.target.value)} style={{flex:1,accentColor:D.accent}}/><span style={{fontFamily:"'JetBrains Mono'",fontSize:11,color:D.text,minWidth:56}}>{k.toLocaleString()}</span></div></div>
      </div>
      {b&&m&&md ? <div className="g3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
        <div style={{background:D.surface,borderRadius:8,padding:'14px 16px',borderLeft:`3px solid ${D.dim}`}}>
          <div style={{color:D.dim,fontSize:9,textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>Ref. mercado peruano</div>
          <div style={{color:D.text,fontFamily:"'JetBrains Mono'",fontWeight:600,fontSize:18}}>{$(mktVal)}</div>
          <div style={{color:D.dim,fontSize:10,marginTop:5}}>NeoAuto / MercadoLibre / Carlo.pe</div>
          <div style={{color:D.dim,fontSize:9,marginTop:3}}>Rango: {$(md.min)} — {$(md.max)}</div>
        </div>
        <div style={{background:`${D.green}08`,borderRadius:8,padding:'14px 16px',borderLeft:`3px solid ${D.green}`}}>
          <div style={{color:D.green,fontSize:9,textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>Oferta sugerida</div>
          <div style={{color:D.green,fontFamily:"'JetBrains Mono'",fontWeight:700,fontSize:20}}>{$(offerVal)}</div>
          <div style={{color:D.dim,fontSize:10,marginTop:5}}>{or[0]?.toUpperCase()+or.slice(1)} {pen>0?`(castigo -${pen}%)`:'(sin castigo)'}</div>
        </div>
        <div style={{background:`${D.gold}08`,borderRadius:8,padding:'14px 16px',borderLeft:`3px solid ${D.gold}`}}>
          <div style={{color:D.gold,fontSize:9,textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>Spread / Ganancia</div>
          <div style={{color:D.gold,fontFamily:"'JetBrains Mono'",fontWeight:700,fontSize:20}}>{$(spread)}</div>
          <div style={{color:D.dim,fontSize:10,marginTop:5}}>{mktVal>0?Math.round(spread/mktVal*100):0}% margen bruto</div>
        </div>
      </div> : <div style={{color:D.dim,fontSize:12,padding:'30px 0',textAlign:'center',fontFamily:"'Inter'",background:D.surface,borderRadius:8}}>Selecciona marca y modelo para ver la tasación.</div>}
    </div>

// ═══════════════════════════════════════════════════════════
// LANDING — Light theme, Space Grotesk, sin emojis
// ═══════════════════════════════════════════════════════════
function Landing({cfg,onAdmin}){
  // Loan simulator state
  const [amt,sAmt]=useState(15000);const [term,sTerm]=useState(36);
  const r=cfg.baseTEA/100/12;const fee=Math.round(amt*r*Math.pow(1+r,term)/(Math.pow(1+r,term)-1));
  const dp=cfg.reqDown?Math.round(amt*(cfg.minDown/100)):0;

  // Vehicle valuator state
  const [vBrand,sVBrand]=useState('');
  const [vModel,sVModel]=useState('');
  const [vYear,sVYear]=useState(2021);
  const [vKm,sVKm]=useState(40000);
  const [vColor,sVColor]=useState('');
  const [vFuel,sVFuel]=useState('');
  const [vTrans,sVTrans]=useState('');
  const [vState,sVState]=useState('');
  const [vPlate,sVPlate]=useState('');
  const [vDebt,sVDebt]=useState('');
  const [vName,sVName]=useState('');

  const brandData = MODEL_DB[vBrand];
  const modelData = brandData?.models?.[vModel];
  const vOrigin = brandData?.origin || '';
  const vPenalty = cfg.penalties[vOrigin] || 0;
  const availModels = brandData ? Object.keys(brandData.models).sort() : [];

  // Estimación de valor: interpolación por año y km
  const calcValue = () => {
    if (!modelData) return 0;
    const age = 2026 - vYear; // años de antigüedad
    const depYear = Math.max(0, 1 - age * 0.07); // 7% por año
    const depKm = Math.max(0, 1 - (vKm / 200000) * 0.3); // hasta 30% por km
    const mid = (modelData.min + modelData.max) / 2;
    const marketRef = Math.round(mid * depYear * depKm);
    return marketRef;
  };
  const vMarketVal = calcValue();
  const vOfferVal = Math.round(vMarketVal * (1 - vPenalty / 100));

  const svcs=[
    {k:'prestamos',title:'Préstamos vehiculares',sub:`Liquidez con tu auto como garantía. Desde ${cfg.baseTEA}% TEA, aprobación en 24h.`,cta:'Solicitar préstamo',color:L.accent},
    {k:'consigna',title:'Venta por consignación',sub:`Dejá tu auto con nosotros y lo vendemos por ti. Comisión: ${cfg.commission}%.`,cta:'Consultar consignación',color:L.accent},
  ].filter(s=>cfg.modules[s.k]!==false);

  return <div style={{fontFamily:"'Inter',sans-serif",background:L.bg,color:L.ink,minHeight:'100vh'}}>
    <style>{CSS}{`
      input[type=range]{accent-color:${L.accent}}
      .svc-c{transition:transform .2s,box-shadow .2s}.svc-c:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
    `}</style>

    {/* NAV */}
    <nav style={{position:'sticky',top:0,zIndex:100,background:'rgba(250,250,248,.92)',backdropFilter:'blur(20px)',borderBottom:`1px solid ${L.border}`,padding:'0 6%'}}>
      <div style={{maxWidth:1120,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',height:60}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{background:L.accent,borderRadius:6,width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700,fontFamily:"'Space Grotesk'"}}>AP</div>
          <span style={{fontWeight:700,fontSize:17,color:L.ink,fontFamily:"'Space Grotesk'",letterSpacing:.3}}>AutoPago</span>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <a href="#compramos" style={{color:L.muted,fontSize:13,padding:'8px 12px',fontWeight:500}}>Vende tu auto</a>
          <a href="#servicios" style={{color:L.muted,fontSize:13,padding:'8px 12px',fontWeight:500}}>Servicios</a>
          <a href="#simulador" style={{color:L.muted,fontSize:13,padding:'8px 12px',fontWeight:500}}>Simulador</a>
          <a href={wa(cfg.whatsapp,'Hola, quiero vender mi auto con AutoPago')} target="_blank" style={{background:L.accent,borderRadius:6,padding:'8px 18px',color:'#fff',fontSize:13,fontWeight:600}}>WhatsApp</a>
          <button onClick={onAdmin} style={{background:'none',border:`1px solid ${L.border}`,borderRadius:6,padding:'7px 12px',color:L.light,cursor:'pointer',fontSize:10,fontFamily:"'Inter'"}}>Admin</button>
        </div>
      </div>
    </nav>

    {/* HERO */}
    <section style={{padding:'100px 6% 80px',position:'relative'}}>
      <div className="hero-g" style={{maxWidth:1120,margin:'0 auto',display:'grid',gridTemplateColumns:'1.2fr 0.8fr',gap:60,alignItems:'center'}}>
        <div>
          <div style={{color:L.warm,fontSize:11,fontWeight:600,letterSpacing:3,textTransform:'uppercase',marginBottom:24,fontFamily:"'Inter'"}}>{cfg.city} — Compra inmediata</div>
          <h1 style={{fontSize:52,fontWeight:700,lineHeight:1.06,marginBottom:24,fontFamily:"'Space Grotesk'",letterSpacing:-1.5,color:L.ink}}>
            ¿Quieres vender tu auto?<br/>
            <span style={{color:L.accent}}>Te pagamos hoy.</span>
          </h1>
          <p style={{color:L.muted,fontSize:16,lineHeight:1.75,marginBottom:36,maxWidth:480}}>
            Envía marca, modelo, año y fotos por WhatsApp. Recibes una oferta de compra en menos de 2 horas. Sin intermediarios, sin compromiso, pago inmediato.

          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <a href="#compramos" style={{background:L.accent,borderRadius:8,padding:'14px 28px',color:'#fff',fontWeight:600,fontSize:14}}>
              Vender mi auto

        <div style={{display:'flex',flexDirection:'column',gap:16}}>

            <div key={l} style={{background:L.surface,border:`1px solid ${L.border}`,borderRadius:10,padding:'20px 24px'}}>
              <div style={{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:28,color:L.ink,letterSpacing:-1}}>{v}</div>
              <div style={{color:L.muted,fontSize:13,marginTop:4}}>{l}</div>
            </div>
          )}
        </div>
      </div>

    {/* COMPRAMOS TU AUTO — Formulario directo a WhatsApp */}
    {cfg.modules.compramos!==false && <section id="compramos" style={{padding:'80px 6%',background:L.surface,borderTop:`1px solid ${L.border}`,borderBottom:`1px solid ${L.border}`}}>

        <div style={{marginBottom:40}}>

            </div>
          </div>

          {/* Fila 2: Año + Km (sliders) */}
          <div className="g2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>

                <span style={{fontFamily:"'JetBrains Mono'",fontWeight:600,fontSize:14,color:L.ink,minWidth:68,textAlign:'center'}}>{vKm.toLocaleString()} km</span>

              {label:'Transmisión',val:vTrans,set:sVTrans,opts:['Mecánica','Automática','CVT']},

              <div key={label}>
                <label style={{display:'block',color:L.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{label}</label>
                <select value={val} onChange={e=>set(e.target.value)}
                  style={{width:'100%',background:L.surface,border:`1px solid ${L.border}`,borderRadius:8,padding:'11px 14px',color:val?L.ink:L.light,fontSize:14,fontFamily:"'Inter'",cursor:'pointer',outline:'none',appearance:'auto'}}>

          </div>

          {/* Fila 4: Estado + Deuda + Placa */}
          <div className="g3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:16}}>
            <div>
              <label style={{display:'block',color:L.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Estado general</label>
              <select value={vState} onChange={e=>sVState(e.target.value)}
                style={{width:'100%',background:L.surface,border:`1px solid ${L.border}`,borderRadius:8,padding:'11px 14px',color:vState?L.ink:L.light,fontSize:14,fontFamily:"'Inter'",cursor:'pointer',outline:'none',appearance:'auto'}}>
                <option value="">—</option>
                {['Excelente','Bueno','Regular','Para reparar'].map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label style={{display:'block',color:L.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>¿Tiene deuda vehicular?</label>
              <select value={vDebt} onChange={e=>sVDebt(e.target.value)}
                style={{width:'100%',background:L.surface,border:`1px solid ${L.border}`,borderRadius:8,padding:'11px 14px',color:vDebt?L.ink:L.light,fontSize:14,fontFamily:"'Inter'",cursor:'pointer',outline:'none',appearance:'auto'}}>
                <option value="">—</option>
                <option value="No">No</option>
                <option value="Sí">Sí</option>
                <option value="No sé">No estoy seguro</option>
              </select>
            </div>
            <div>
              <label style={{display:'block',color:L.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Placa</label>
              <input type="text" value={vPlate} onChange={e=>sVPlate(e.target.value.toUpperCase())} placeholder="ABC-123" maxLength={7}
                style={{width:'100%',background:L.surface,border:`1px solid ${L.border}`,borderRadius:8,padding:'11px 14px',color:L.ink,fontSize:14,fontFamily:"'JetBrains Mono'",outline:'none',letterSpacing:1}}/>
            </div>
          </div>

          {/* Fila 5: Nombre del propietario */}
          <div style={{marginBottom:24}}>
            <label style={{display:'block',color:L.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Tu nombre</label>
            <input type="text" value={vName} onChange={e=>sVName(e.target.value)} placeholder="Nombre completo"
              style={{width:'100%',background:L.surface,border:`1px solid ${L.border}`,borderRadius:8,padding:'11px 14px',color:L.ink,fontSize:14,fontFamily:"'Inter'",outline:'none'}}/>
          </div>

          {/* Resumen + CTA */}
          {vBrand && vModel && <div style={{background:L.accentLight,borderRadius:8,padding:'14px 16px',marginBottom:20}}>
            <div style={{color:L.accent,fontSize:13,fontWeight:600}}>
              {vBrand} {vModel} {vYear} — {vKm.toLocaleString()} km{vColor?` — ${vColor}`:''}{vTrans?` — ${vTrans}`:''}
            </div>
            <div style={{color:L.muted,fontSize:12,marginTop:4}}>Un asesor te contactará por WhatsApp con una oferta personalizada.</div>
          </div>}

          {(()=>{
            const ready = vBrand && vModel;
            const parts = [`Hola, quiero vender mi vehículo:`];
            parts.push(`• ${vBrand} ${vModel} ${vYear}`);
            parts.push(`• ${vKm.toLocaleString()} km`);
            if(vColor) parts.push(`• Color: ${vColor}`);
            if(vFuel) parts.push(`• Combustible: ${vFuel}`);
            if(vTrans) parts.push(`• Transmisión: ${vTrans}`);
            if(vState) parts.push(`• Estado: ${vState}`);
            if(vDebt) parts.push(`• Deuda vehicular: ${vDebt}`);
            if(vPlate) parts.push(`• Placa: ${vPlate}`);
            if(vName) parts.push(`• Propietario: ${vName}`);
            parts.push(`¿Me pueden hacer una oferta de compra?`);
            const msg = parts.join('\n');
            return <a href={ready ? wa(cfg.whatsapp, msg) : '#'}
              target={ready?"_blank":undefined}
              onClick={e=>{if(!ready)e.preventDefault()}}
              style={{display:'block',width:'100%',background:ready?L.accent:L.border,border:'none',borderRadius:8,padding:'14px',color:ready?'#fff':L.light,fontWeight:600,fontSize:14,textAlign:'center',cursor:ready?'pointer':'not-allowed',fontFamily:"'Inter'"}}>

    {svcs.length>0&&<section id="servicios" style={{padding:'80px 6%',background:L.surface,borderTop:`1px solid ${L.border}`,borderBottom:`1px solid ${L.border}`}}>
      <div style={{maxWidth:1120,margin:'0 auto'}}>
        <div style={{maxWidth:480,marginBottom:50}}>
          <div style={{color:L.warm,fontSize:11,fontWeight:600,letterSpacing:3,textTransform:'uppercase',marginBottom:12,fontFamily:"'Inter'"}}>Servicios</div>

  </>;
}
